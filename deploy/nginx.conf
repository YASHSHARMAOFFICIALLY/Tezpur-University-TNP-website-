# TLS cert from university IT or Let's Encrypt (free): put fullchain.pem + privkey.pem in deploy/certs.
server {
  listen 80;
  server_name _;
  return 301 https://$host$request_uri;
}
server {
  listen 443 ssl;
  http2 on;
  server_name _;
  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  add_header Strict-Transport-Security "max-age=31536000" always;
  client_max_body_size 25m;   # largest upload (brochure 20 MB) + multipart overhead

  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-Id $request_id;

  location /api/ { proxy_pass http://app:3000; }
  location = /healthz { proxy_pass http://app:3000; }
  location = /readyz { proxy_pass http://app:3000; }
  location / { proxy_pass http://web:3000; }
}
