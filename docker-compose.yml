# Everything self-hosted on the university server. No paid services.
services:
  postgres: # dev and tests only: fixed tnp/tnp, published on localhost:5434
    image: postgres:16
    environment: { POSTGRES_USER: tnp, POSTGRES_PASSWORD: tnp, POSTGRES_DB: tnp }
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5434:5432"]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "tnp"], interval: 5s, retries: 10 }
    restart: unless-stopped
    profiles: [dev]

  mailpit: # dev only: catches all mail, UI on :8025
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
    profiles: [dev]

  db: # production database: password from .env, no host port
    image: postgres:16
    # `:?` would fail every compose command in dev, so an empty value is caught by the postgres image instead.
    environment: { POSTGRES_USER: tnp, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-}", POSTGRES_DB: tnp }
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "tnp"], interval: 5s, retries: 10 }
    restart: unless-stopped
    profiles: [prod]

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: "postgresql://tnp:${POSTGRES_PASSWORD:-}@db:5432/tnp"
      UPLOAD_DIR: /app/data/uploads
    volumes: [./data/uploads:/app/data/uploads]
    depends_on: { db: { condition: service_healthy } }
    restart: unless-stopped
    profiles: [prod]

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    ports: ["80:80", "443:443"]
    depends_on: [app]
    restart: unless-stopped
    profiles: [prod]

volumes:
  pgdata:
  dbdata:
